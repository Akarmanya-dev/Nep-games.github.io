<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nep Games</title>
  <meta name="description" content="Small browser games about the moments every Nepali remembers.">
  <meta name="theme-color" content="#ffd21a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Baloo+2:wght@600;800&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Same pasal palette as the games: yellow signboard, mint walls. */
    :root {
      --wall: #d5ead8;
      --wall-line: rgba(255, 255, 255, .28);
      --wall-shadow: #b6d4bd;
      --ink: #10212b;
      --muted: #3f5a67;
      --sign: #ffd21a;
      --sign-red: #d4001a;
      --sign-black: #141414;
      --paper: #fffdf6;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh;
      background:
        repeating-linear-gradient(90deg, var(--wall-line) 0 2px, transparent 2px 46px),
        linear-gradient(180deg, var(--wall) 0%, var(--wall) 70%, var(--wall-shadow) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Mukta", system-ui, sans-serif;
      line-height: 1.5;
    }
    .sign {
      background: var(--sign);
      border-bottom: 8px solid var(--sign-red);
      box-shadow: 0 5px 0 rgba(0, 0, 0, .12);
      text-align: center;
      padding: 28px 16px 22px;
    }
    .sign h1 {
      font-family: "Yatra One", sans-serif; font-weight: 400;
      color: var(--sign-red);
      font-size: clamp(2.6rem, 11vw, 4.4rem);
      line-height: 1;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, .15);
    }
    .sign p {
      font-family: "Baloo 2", sans-serif; font-weight: 800;
      letter-spacing: .14em; text-transform: uppercase;
      font-size: clamp(.7rem, 2.6vw, .95rem);
      margin-top: 6px;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    .games {
      list-style: none; padding: 0;
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
      justify-content: center;
    }
    .game a {
      display: flex; align-items: center; gap: 16px;
      height: 100%;
      padding: 18px;
      background: var(--paper);
      border: 3px solid var(--sign-black);
      border-radius: 12px;
      box-shadow: 5px 5px 0 var(--sign-black);
      color: inherit; text-decoration: none;
      transition: transform .12s, box-shadow .12s;
    }
    .game a:hover, .game a:focus-visible { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--sign-red); }
    .game .icon { font-size: 2.2rem; width: 52px; text-align: center; flex-shrink: 0; }
    .game .name { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1.15rem; line-height: 1.2; }
    .game .desc { color: var(--muted); font-size: .95rem; }
    .empty {
      padding: 28px 20px; border-radius: 12px;
      border: 3px dashed var(--muted); color: var(--muted); text-align: center;
    }
    .empty strong { display: block; color: var(--ink); font-size: 1.15rem; }
    footer { color: var(--muted); font-size: .9rem; margin-top: 40px; text-align: center; }
  </style>
</head>
<body>
  <header class="sign">
    <h1>नेपाली खेल</h1>
    <p>Games about the moments every Nepali remembers</p>
  </header>

  <main>
    <ul class="games" id="games"></ul>
    <footer>More games coming · अरू खेल छिट्टै</footer>
  </main>

  <script>
    // Add each finished game here; its folder lives at games/<slug>/index.html.
    const GAMES = [
      { slug: "recharge-card", icon: "📱", name: "रिचार्ज कार्ड · Recharge Card", desc: "Scratch it, dial it. Don't scratch off the numbers." },
      { slug: "chungi", icon: "🦶", name: "चुङ्गी · Chungi", desc: "Keep the rubber-band ball in the air. Solo or pass the phone." },
      { slug: "morning-assembly", icon: "🧍", name: "प्रार्थना · Morning Assembly", desc: "सावधान! विश्राम! Don't let PT sir catch you swaying." },
      { slug: "dandi-biyo", icon: "🏏", name: "डन्डी बियो · Dandi Biyo", desc: "Flick it, guard the hole, whack it. Measured in dandi lengths." },
      { slug: "changa-chait", icon: "🪁", name: "चङ्गा चैट · Changa Chait", desc: "Dashain kite fight over Kathmandu. Pull from above, let go from below." },
    ];

    const list = document.getElementById("games");
    if (GAMES.length === 0) {
      list.outerHTML = '<div class="empty"><strong>पहिलो खेल छिट्टै आउँदैछ</strong>The first game is coming soon.</div>';
    } else {
      for (const g of GAMES) {
        const li = document.createElement("li");
        li.className = "game";
        // Link to index.html explicitly so it also works when opened as a local file.
        li.innerHTML = `<a href="games/${g.slug}/index.html"><span class="icon">${g.icon}</span>
          <span><span class="name"></span><br><span class="desc"></span></span></a>`;
        li.querySelector(".name").textContent = g.name;
        li.querySelector(".desc").textContent = g.desc;
        list.appendChild(li);
      }
    }
  </script>
</body>
</html>
